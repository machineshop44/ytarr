host: 0.0.0.0
port: 8199
# Default 0.0.0.0 = LAN + port-forward (Arrs Hub Mobile). Use 127.0.0.1 for localhost-only.
# api_key is auto-generated on first start — see Settings → General (or regenerate there).
# api_key: ""
api_auth_required: true
# Relative paths are resolved from the ytarr app folder (portable).
data_dir: data
# Prefer absolute paths on the Plex machine when library is on another drive, e.g. E:\Media\YouTube
library_root: library
music_library_root: music
# Optional Sonarr-style mappings (host path ytarr writes ↔ path Plex sees)
path_mappings: []
#  - host_path: D:\YouTube
#    plex_path: \\NAS\media\YouTube
# Empty or "yt-dlp" = bundled Python module (pip install -r backend/requirements.txt).
ytdlp_path: yt-dlp
# Empty = auto-detect tools/ffmpeg inside this app, then PATH.
# Or set a path relative to the app folder, e.g. tools/ffmpeg/ffmpeg.exe
ffmpeg_path: tools/ffmpeg/ffmpeg.exe
# Optional Netscape cookies.txt / browser cookies for YouTube bot/age gates.
# Prefer cookies.txt on Windows: Chrome/Edge --cookies-from-browser often fails
# with DPAPI / App-Bound encryption (yt-dlp#10927) or a locked cookie DB while
# Chrome is open (yt-dlp#7271). When cookies_path exists, ytarr uses it and
# ignores cookies_from_browser. Catalog fetches retry without cookies on failure.
# ytdlp_cookies_path: "C:/path/to/cookies.txt"
# ytdlp_cookies_from_browser: ""   # chrome | edge | firefox | brave (firefox safest)
# Named preset: best | 2160p | 1080p | 720p | 480p | worst | custom
default_quality: best
# Music bitrate: best | 320k | 192k | 128k | 64k | worst | custom
default_music_quality: best
# Used when default_quality (or a source's quality) is "custom"
format: bv*+ba/b
# Used when default_music_quality / music source quality is "custom"
music_format: ba/b
# Plex Home Videos: organized after download to Channel/Season XX/Show - SxxExx - Title [id].ext
output_template: '%(uploader,playlist_title|Unknown)s/%(upload_date>%Y-%m-%d)s - %(title).200B [%(id)s].%(ext)s'
music_output_template: '%(uploader,artist|Unknown)s/%(title).200B.%(ext)s'
poll_interval_minutes: 30
concurrent_downloads: 1
nocheck_certificates: false
# Cut SponsorBlock-marked segments (ffmpeg). Unmarked videos are unchanged.
sponsorblock_remove: true
sponsorblock_categories_video: sponsor,selfpromo,interaction,intro,outro
sponsorblock_categories_music: music_offtopic,sponsor,selfpromo,interaction,intro,outro
# Plex Connect — refresh library after download / rename / delete-with-files
plex_enabled: false
plex_url: http://127.0.0.1:32400
# plex_token: ""   # Settings → Account → Show more → plex.tv token, or XML from plex.tv/claim
plex_video_section_id: ""
plex_music_section_id: ""
plex_refresh_debounce_seconds: 45
# Discord-compatible webhook (Connect notifications)
# connect_webhook_url: ""
connect_on_download: true
connect_on_failure: true
connect_on_grab: false
